apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: free5gc
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/philiphabib/free5gc-cloud.git
    targetRevision: main
    path: .

    helm:
      releaseName: free5gc

  destination:
    server: https://kubernetes.default.svc
    namespace: free5gc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
