apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: portfolio-api
  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/philiphabib/kubernetes-homelab.git

    targetRevision: HEAD

    path: apps/portfolio-api

  destination:

    server: https://kubernetes.default.svc

    namespace: portfolio

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

    - CreateNamespace=true
