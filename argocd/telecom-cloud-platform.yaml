apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telecom-cloud-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/philiphabib/telecom-cloud-platform.git
    targetRevision: main
    path: deploy/helm/telecom-cloud-platform

    helm:
      releaseName: telecom-cloud-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: telecom-cloud

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
