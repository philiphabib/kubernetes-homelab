apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: telecom-platform
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - name: telecom-cloud-platform
            repoURL: https://github.com/philiphabib/telecom-cloud-platform.git
            revision: main
            path: deploy/helm/telecom-cloud-platform
            namespace: telecom-cloud
          # Open5GS 5G Core
          - name: open5gs
            repoURL: https://github.com/philiphabib/open5gs-gitops.git
            revision: main
            path: .
            namespace: open5gs
          # N3IWF
         # - name: n3iwf
          #  repoURL: https://github.com/philiphabib/n3iwf-gitops.git
           # revision: main
           # path: .
           # namespace: n3iwf

  template:
    metadata:
      name: '{{name}}'

    spec:
      project: default

      source:
        repoURL: '{{repoURL}}'
        targetRevision: '{{revision}}'
        path: '{{path}}'

        helm:
          releaseName: '{{name}}'
          valueFiles:
            - values-5g.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
