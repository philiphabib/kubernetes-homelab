apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: telecom-platform
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - name: telecom-cloud-platform
            repoURL: https://github.com/philiphabib/telecom-cloud-platform.git
            revision: main
            path: deploy/helm/telecom-cloud-platform
            namespace: telecom-cloud
            valuesFile: values.yaml          # ← this repo uses values.yaml
          - name: open5gs
            repoURL: https://github.com/philiphabib/open5gs-gitops.git
            revision: main
            path: .
            namespace: open5gs
            valuesFile: values-5g.yaml       # ← this repo uses values-5g.yaml
          # N3IWF (currently disabled)
          # - name: n3iwf
          #   repoURL: https://github.com/philiphabib/n3iwf-gitops.git
          #   revision: main
          #   path: .
          #   namespace: n3iwf
          #   valuesFile: values-5g.yaml

  template:
    metadata:
      name: '{{name}}'

    spec:
      project: default

      source:
        repoURL: '{{repoURL}}'
        targetRevision: '{{revision}}'
        path: '{{path}}'

        helm:
          releaseName: '{{name}}'
          valueFiles:
            - '{{valuesFile}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
